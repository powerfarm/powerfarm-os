# REGRA 6 — código de PR roda SEM nenhum secret de infra.
# Dois jobs: o que roda código não confiado não tem credencial; o que tem
# credencial roda script vindo da main, não da branch.
name: PR
on: pull_request

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------
  # Código do PR. Zero secrets. Um postinstall malicioso não acha nada.
  # -------------------------------------------------------------------
  estatico:
    runs-on: ubuntu-latest
    env:
      POWERFARM_OWNER_EMAIL: ${{ vars.POWERFARM_OWNER_EMAIL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { submodules: recursive, persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24 }
      - run: corepack enable
      - name: REGRA 0 — core vem do upstream oficial
        run: node scripts/guards/check-upstream-source.mjs
      - name: REGRA 0a — starter oficial permanece intacto
        run: node scripts/guards/check-starter-source.mjs
      - run: pnpm install --frozen-lockfile
      - name: REGRA 0b — contrato Powerfarm preservado
        run: node scripts/guards/check-platform-contract.mjs
      - run: pnpm --dir cloudflare-os install --frozen-lockfile

      - name: REGRA 2 — migration destrutiva aprovada pelo conteúdo
        run: node scripts/guards/check-migrations.mjs
      - name: Gerar configs, testes e dry-run completo
        run: pnpm check
      - name: state/esperado.json em dia com o repo
        run: node scripts/derive-expected.mjs --check
      - name: REGRA 3 — nenhum binding some nem troca de alvo
        run: node scripts/guards/check-bindings.mjs
      - name: REGRA 4 — admin no fonte E no artefato gerado
        run: node scripts/guards/check-admins.mjs

      - uses: actions/upload-artifact@v4
        with: { name: configs-gerados, path: "**/wrangler.prod.jsonc" }

  # -------------------------------------------------------------------
  # Confiado. Roda scripts da main contra a conta, com token read-only.
  # Nunca executa código da branch do PR. O diff da branch é lido apenas como
  # nomes de arquivos para saber quais Workers o merge pretende reconciliar.
  # -------------------------------------------------------------------
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da MAIN (não do PR)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24 }
      - run: corepack enable && pnpm install --frozen-lockfile --ignore-scripts

      - name: Derivar escopo de drift só pelos nomes dos arquivos do PR
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --quiet --no-tags --depth=1 origin "$HEAD_SHA"
          FILES="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$FILES"

          # Mudança de topologia/shared runtime será convergida por deploy completo;
          # não faz sentido bloquear o PR porque exatamente esse escopo já difere live.
          if printf '%s\n' "$FILES" | grep -Eq '^(deployment\.jsonc|package\.json|pnpm-lock\.yaml|cloudflare-os$|scripts/deploy-powerfarm\.mjs|scripts/lib\.mjs|state/esperado\.json)$'; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo 'ignore=' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IGNORE=''
          add_ignore() {
            case ",$IGNORE," in
              *",$1,"*) ;;
              *) IGNORE="${IGNORE:+$IGNORE,}$1" ;;
            esac
          }

          printf '%s\n' "$FILES" | grep -q '^packages/gatekeeper-identity/' && add_ignore 'powerfarm-gk-identity' || true
          printf '%s\n' "$FILES" | grep -q '^packages/powerfarm-engine/' && add_ignore 'powerfarm-engine' || true
          printf '%s\n' "$FILES" | grep -q '^packages/custom-gatekeeper/' && add_ignore 'powerfarm-gk-custom' || true
          printf '%s\n' "$FILES" | grep -q '^packages/error-reporter/' && add_ignore 'powerfarm-error-reporter' || true

          # Qualquer caminho de runtime desconhecido é conservadoramente tratado
          # como convergência completa. Docs/workflows/tests não entram aqui.
          UNKNOWN="$(printf '%s\n' "$FILES" | grep -Ev '^(docs/|\.github/|README\.md$|.*\.md$|packages/(gatekeeper-identity|powerfarm-engine|custom-gatekeeper|error-reporter)/|scripts/|state/)' || true)"
          if [ -n "$UNKNOWN" ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo 'ignore=' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo 'skip=false' >> "$GITHUB_OUTPUT"
          echo "ignore=$IGNORE" >> "$GITHUB_OUTPUT"

      - name: Materializar baseline confiável sem Workers que o PR vai reconciliar
        if: steps.scope.outputs.skip != 'true'
        env:
          IGNORE_WORKERS: ${{ steps.scope.outputs.ignore }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const expected = JSON.parse(fs.readFileSync('state/esperado.json', 'utf8'));
          const ignored = (process.env.IGNORE_WORKERS || '').split(',').filter(Boolean);
          for (const worker of ignored) delete expected.workers[worker];
          if (!Object.keys(expected.workers || {}).length) process.exit(2);
          fs.writeFileSync('/tmp/powerfarm-pr-esperado.json', JSON.stringify(expected, null, 2) + '\n');
          NODE

      - name: REGRA 1 — produção bate com o baseline fora do escopo do PR
        if: steps.scope.outputs.skip != 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Este job executa somente o check-drift vindo da main confiável.
          # O secret read-only está inválido (401); o token operacional entra
          # apenas nesta etapa, depois da instalação sem credenciais.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/check-drift.mjs --esperado /tmp/powerfarm-pr-esperado.json

      - name: Drift será reconciliado integralmente pelo merge
        if: steps.scope.outputs.skip == 'true'
        run: echo 'PR altera topologia/shared runtime; deploy pós-merge fará convergência completa.'
