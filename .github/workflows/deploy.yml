# REGRA 5 publicação e ativação em ordem explícita
# REGRA 7 pontos de volta gravados ANTES de qualquer ativação
# REGRA 8 falha de deploy OU de smoke dispara recuperação;
#         recuperação só é declarada boa depois de novo smoke
name: Deploy
on:
  push:
    branches: [main]

concurrency:
  group: deploy-producao
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: producao
    # Nenhum secret de infra no env do job. Cada step pede o que precisa.
    # Assim `pnpm install` nunca roda com credencial Cloudflare no ambiente.
    env:
      POWERFARM_OWNER_EMAIL: ${{ vars.POWERFARM_OWNER_EMAIL }}
      PUBLIC_URL: ${{ vars.POWERFARM_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { submodules: recursive, persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24 }
      - run: corepack enable

      # ---- sem credencial nenhuma daqui ----------------------------------
      - name: REGRA 0 — core vem do upstream oficial
        run: node scripts/guards/check-upstream-source.mjs
      - name: REGRA 0a — starter oficial permanece intacto
        run: node scripts/guards/check-starter-source.mjs
      - run: pnpm install --frozen-lockfile
      - name: REGRA 0b — contrato Powerfarm preservado
        run: node scripts/guards/check-platform-contract.mjs
      - run: pnpm --dir cloudflare-os install --frozen-lockfile
      - name: REGRA 2 — migration destrutiva aprovada pelo conteúdo
        run: node scripts/guards/check-migrations.mjs
      - name: Gerar configs, testes e dry-run completo
        run: pnpm check
      - name: state/esperado.json em dia com o repo
        run: node scripts/derive-expected.mjs --check
      - name: REGRA 3 — nenhum binding some nem troca de alvo
        run: node scripts/guards/check-bindings.mjs
      - name: REGRA 4 — admin no fonte E no artefato gerado
        run: node scripts/guards/check-admins.mjs

      - name: Selecionar o menor conjunto seguro de Workers
        id: targets
        run: |
          # A dívida de um deploy falhado não desaparece no push seguinte.
          # Compare sempre com o último commit efetivamente implantado, não
          # apenas com o commit imediatamente anterior no GitHub.
          LAST=$(node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("state/ultimo-deploy.json","utf8")); if(!x.commit) process.exit(2); process.stdout.write(x.commit)')
          TARGETS="$(node scripts/select-deploy-targets.mjs --base "$LAST" --head '${{ github.sha }}')"
          WORKERS="$(node scripts/select-deploy-targets.mjs --base "$LAST" --head '${{ github.sha }}' --worker-names)"
          case "$TARGETS" in
            engine|identity|engine,identity) SELECTIVE_RUNTIME=true ;;
            *) SELECTIVE_RUNTIME=false ;;
          esac
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
          echo "workers=$WORKERS" >> "$GITHUB_OUTPUT"
          echo "selective_runtime=$SELECTIVE_RUNTIME" >> "$GITHUB_OUTPUT"
          echo "baseline_commit=$LAST" >> "$GITHUB_OUTPUT"
          echo "baseline do último deploy: ${LAST:0:12}"
          echo "targets: $TARGETS"
          echo "workers: $WORKERS"

      # ---- leitura de settings: token read-only só no drift -------------
      # Produção deve bater com o que FOI implantado por último. Workers que
      # este próprio run vai reconciliar podem divergir (por exemplo, um hotfix
      # manual); os Workers fora do escopo continuam protegidos contra drift.
      - name: Materializar referência do último deploy
        id: baseline
        if: steps.targets.outputs.targets != 'none'
        run: |
          LAST=$(node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("state/ultimo-deploy.json","utf8")); if(!x.commit) process.exit(2); process.stdout.write(x.commit)')
          git fetch --quiet --no-tags --depth=1 origin "$LAST"
          git show "$LAST:state/esperado.json" > /tmp/powerfarm-esperado-ultimo.json
          echo "commit=$LAST" >> "$GITHUB_OUTPUT"
          echo "baseline do último deploy: ${LAST:0:12}"

      - name: REGRA 1 — produção bate com o último deploy fora do escopo atual
        if: steps.targets.outputs.targets != 'none'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_READONLY }}
        run: node scripts/check-drift.mjs --esperado /tmp/powerfarm-esperado-ultimo.json --ignore-workers "${{ steps.targets.outputs.workers }}"

      # /deployments exige o token operacional; o read-only é insuficiente.
      - name: REGRA 7 — gravar pontos de volta
        if: steps.targets.outputs.targets != 'none'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/record-versions.mjs --out versoes-antes.json

      # ---- escrita: token de deploy, só neste step -----------------------
      - name: Deploy somente do escopo selecionado
        id: deploy
        if: steps.targets.outputs.targets != 'none'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          TARGETS='${{ steps.targets.outputs.targets }}'
          if [ '${{ steps.targets.outputs.selective_runtime }}' = 'true' ]; then
            case ",$TARGETS," in
              *,engine,*)
                echo 'deploy seletivo: powerfarm-engine'
                pnpm --dir packages/powerfarm-engine exec wrangler deploy --config wrangler.prod.jsonc
                ;;
            esac
            case ",$TARGETS," in
              *,identity,*)
                echo 'deploy seletivo: powerfarm-gk-identity'
                pnpm --dir packages/gatekeeper-identity exec wrangler deploy --config wrangler.prod.jsonc
                ;;
            esac
          else
            # Mudança de topologia/shared runtime exige convergência completa.
            pnpm deploy
          fi

      - name: REGRA 8a — versões correspondem ao escopo deste run
        id: versoes
        if: steps.deploy.outcome == 'success'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ '${{ steps.targets.outputs.selective_runtime }}' = 'true' ]; then
            node scripts/verify-versions.mjs --antes versoes-antes.json --changed-workers "${{ steps.targets.outputs.workers }}"
          else
            node scripts/verify-versions.mjs --antes versoes-antes.json
          fi

      - name: REGRA 8b — borda pública responde de verdade
        id: smoke
        if: steps.versoes.outcome == 'success'
        run: node scripts/smoke-test.mjs "$PUBLIC_URL"

      # ---- recuperação: dispara em QUALQUER falha acima do deploy --------
      # Inclui o caso perigoso: deploy quebra no meio, smoke nem roda.
      - name: Recuperar somente Workers tocados
        if: failure() && steps.deploy.conclusion != 'skipped'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PUBLIC_URL: ${{ vars.POWERFARM_PUBLIC_URL }}
        run: node scripts/rollback.mjs --from versoes-antes.json --only-workers "${{ steps.targets.outputs.workers }}" --verify

      # Só há incidente se algo chegou a ser escrito. Falha de portão (antes do
      # deploy) é o sistema funcionando, não incidente.
      - name: Abrir incidente se a recuperação não fechou
        if: failure() && steps.deploy.conclusion != 'skipped'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh issue create \
            --title "INCIDENTE: deploy falhou em ${GITHUB_SHA::7}" \
            --label incidente \
            --body "$(printf '%s\n' \
              'O deploy falhou e a recuperação automática não confirmou volta ao ar.' \
              '' \
              '**Isto precisa de você agora.**' \
              '' \
              "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              '' \
              'O artefato `versoes-antes.json` do run tem o version ID de cada worker.' \
              'Manual: Dashboard > Workers > worker > Deployments > Rollback.')"

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: pontos-de-volta, path: versoes-antes.json, if-no-files-found: warn }

      # ---- registro do que ficou no ar (prova, não fonte da verdade) -----
      - name: Registrar deploy conhecido
        if: success() && steps.targets.outputs.targets != 'none'
        run: |
          node scripts/record-versions.mjs --out state/ultimo-deploy.json
          git config user.name  "powerfarm-ci"
          git config user.email "ci@powerfarm.local"
          git add state/ultimo-deploy.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: deploy ${GITHUB_SHA::7}"
          # O checkout usa persist-credentials: false para que a credencial do
          # GitHub nao exista durante `pnpm install`. Ela entra so aqui, no
          # unico comando que precisa empurrar.
          git push "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_PUSH_TOKEN: ${{ github.token }}
